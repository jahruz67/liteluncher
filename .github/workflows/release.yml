name: Build and release APK

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Each push releases its commit with an automatically generated tag.
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: v1.0.${{ github.run_number }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must look like v1.0.0 or v1.0.0-beta01."
            exit 1
          fi
          # Local builds use code 1. Reruns retain the original release code.
          version_code=$((RELEASE_RUN_NUMBER + 1))
          if (( version_code < 2 || version_code > 2100000000 )); then
            echo "::error::Release version code is outside Android's supported range."
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Verify release tag matches source
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$RELEASE_TAG"
          if git ls-remote --exit-code --refs origin "$tag_ref" > /dev/null; then
            git fetch --no-tags origin "$tag_ref"
            tag_commit=$(git rev-parse 'FETCH_HEAD^{commit}')
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::The release tag points to a different commit. Run this workflow using that tag as its ref."
              exit 1
            fi
          else
            status=$?
            if (( status != 2 )); then
              echo "::error::Unable to check the release tag."
              exit "$status"
            fi
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_SIGNING_KEYSTORE_BASE64 ANDROID_SIGNING_ALIAS ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lite-luncher-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/lite-luncher-release.jks" \
            -storepass:env ANDROID_SIGNING_STORE_PASSWORD -alias "$ANDROID_SIGNING_ALIAS" > /dev/null

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean :app:assembleRelease \
            -PreleaseVersionCode="$RELEASE_VERSION_CODE" \
            -PreleaseVersionName="$RELEASE_VERSION_NAME"

      - name: Sign and verify release APK
        shell: bash
        env:
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release
          apk_path="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ ! -f "$apk_path" ]]; then
            echo "::error::No unsigned release APK was generated."
            find app/build/outputs -maxdepth 4 -type f -print >&2 || true
            exit 1
          fi
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          release_apk="release/lite-luncher-${RELEASE_TAG}.apk"
          "$build_tools/zipalign" -f -P 16 4 "$apk_path" "$RUNNER_TEMP/lite-luncher-aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/lite-luncher-release.jks" \
            --ks-key-alias "$ANDROID_SIGNING_ALIAS" \
            --ks-pass env:ANDROID_SIGNING_STORE_PASSWORD \
            --key-pass env:ANDROID_SIGNING_KEY_PASSWORD \
            --out "$release_apk" "$RUNNER_TEMP/lite-luncher-aligned.apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$release_apk"
          "$build_tools/zipalign" -c -P 16 4 "$release_apk"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Lite Luncher ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_VERSION_NAME, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*.apk

      - name: Remove temporary signing key
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/lite-luncher-release.jks"
